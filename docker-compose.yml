services:
  discord-llm-bot:
    pull_policy: build
    build:
      context: ./bot
      dockerfile: Dockerfile
      network: host
    container_name: discord-bot
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Rome
    volumes:
      - ".env:/app/.env"
      - "./config:/app/config"
      - "/tmp/discord-llm-bot:/tmp/discord-llm-bot"
      - "./audios:/app/audios"
    image: "blastbeng/discord-llm-bot:1.0.0"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f discord-llm-bot || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  whatsapp-bridge:
    build:
      context: ./wapp-bridge
      dockerfile: Dockerfile
    container_name: whatsapp-bridge
    env_file: .env.wapp
    volumes:
      - "./wapp-bridge/auth_state:/app/auth_state"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/status',r=>{process.exit(r.statusCode===200?0:1)})\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  whatsapp-bot:
    build:
      context: ./wapp-bot
      dockerfile: Dockerfile
    container_name: whatsapp-bot
    env_file: .env.wapp
    volumes:
      - "./config:/app/config"
      - "./audios:/app/audios"
    depends_on:
      - whatsapp-bridge
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f wapp-bot || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s