  telegram-bot:
    pull_policy: always
    image: "blastbeng/telegram-llm-bot:1.0.0"
    container_name: telegram-bot
    env_file: .env.telegram
    volumes:
      - "./config:/app/config"
      - "./audios:/app/audios"
      - "/tmp/discord-llm-bot:/tmp/discord-llm-bot"
    networks:
      - default
      - ai-mcp
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f telegram-bot || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

networks:
  ai-mcp:
    external: true
    name: ai-mcp
