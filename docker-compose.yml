# Main compose file: services pull their images from Docker Hub.
# To build locally from source instead, use:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml build <service>
# or the provided ./docker-build.sh --force-local
services:
  discord-llm-bot:
    pull_policy: always
    image: "blastbeng/discord-llm-bot:1.0.0"
    container_name: discord-bot
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Rome
    volumes:
      - ".env:/app/.env"
      - "./config:/app/config"
      - "/tmp/discord-llm-bot:/tmp/discord-llm-bot"
      - "./audios:/app/audios"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f discord-llm-bot || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

