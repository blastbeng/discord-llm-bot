# Override file to build the services locally from source (instead of pulling
# from Docker Hub). Use with:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml build <service>
# or via the provided ./docker-build.sh --force-local
#
# The `image:` names must match docker-compose.yml so the locally-built images
# replace (tag) the same names that would otherwise be pulled from the registry.
services:
  discord-llm-bot:
    image: "blastbeng/discord-llm-bot:1.0.0"
    build:
      context: ./bot
      dockerfile: Dockerfile
      network: host

  # [TEMP-DISABLED] WhatsApp services are temporarily disabled. Uncomment to re-enable.
