  #   build:
  #     context: ./wapp-bot
  #     dockerfile: Dockerfile

  telegram-bot:
    image: "blastbeng/telegram-llm-bot:1.0.0"
    build:
      context: ./telegram-bot
      dockerfile: Dockerfile

  voiceclone:
    image: "blastbeng/voiceclone:1.0.0"
    build:
      context: ./voiceclone
      dockerfile: Dockerfile
      network: host
