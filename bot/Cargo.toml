[package]
name = "discord-llm-bot"
version = "1.0.0"
edition = "2021"

[dependencies]
serenity = { version = "0.12.5", features = ["client", "gateway", "rustls_backend", "voice", "model", "cache"] }
poise = "0.6"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "signal", "process", "fs", "net", "sync"] }
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-rustls", "macros", "chrono"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "cookies", "multipart"] }
dotenv = "0.15"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
md5 = "0.7"
songbird = { version = "0.6", features = ["serenity", "rustls", "builtin-queue", "receive"] }
symphonia = { version = "0.6", features = ["mp3"] }
# Enable MP3 format reader on the symphonia 0.5 version that songbird uses internally.
# Without this, songbird's probe can't find the MP3 marker and reports "probe reach EOF".
symphonia05 = { package = "symphonia", version = "0.5", features = ["mp3"] }
minimp3 = "0.6"
hound = "3.4"
mp3lame-encoder = "0.2"
urlencoding = "2.1"
regex = "1"
rand = "0.8"
sysinfo = "0.30"
id3 = "1.14"
base64 = "0.22"
uuid = { version = "1.10", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

# Enhanced error handling and monitoring (New additions)
async-trait = "0.1"
thiserror = "1.0"           # Error type definitions and implementation
chrono = "0.4"              # Time operations for timestamps and durations
