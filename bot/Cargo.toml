[package]
name = "discord-llm-bot"
version = "1.0.0"
edition = "2021"

[dependencies]
serenity = { version = "0.12.5", features = ["client", "gateway", "rustls_backend", "voice", "model", "cache"] }
poise = "0.6"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "signal", "process", "fs"] }
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-rustls", "macros", "chrono"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
dotenv = "0.15"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
md5 = "0.7"
songbird = { version = "0.6", features = ["serenity", "rustls", "builtin-queue"] }
symphonia = { version = "0.5", features = ["mp3", "isomp4", "alac", "aac"] }
urlencoding = "2.1"
rand = "0.8"
base64 = "0.22"
sysinfo = "0.30"
id3 = "1.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

# Enhanced error handling and monitoring (New additions)
thiserror = "1.0"           # Error type definitions and implementation
chrono = "0.4"              # Time operations for timestamps and durations
tracing = "0.1"             # Structured logging and tracing support
tracing-subscriber = "0.3"  # Advanced tracing capabilities
