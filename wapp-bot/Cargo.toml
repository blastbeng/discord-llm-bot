[package]
name = "wapp-bot"
version = "1.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "fs", "process", "net", "sync"] }
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-rustls", "macros", "chrono"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "cookies", "multipart"] }
dotenv = "0.15"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
md5 = "0.7"
rand = "0.8"
urlencoding = "2.1"
id3 = "1.14"
minimp3 = "0.6"
hound = "3.4"
mp3lame-encoder = "0.2"
thiserror = "1.0"
axum = "0.7"
base64 = "0.22"
sha2 = "0.10"