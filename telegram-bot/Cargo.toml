[package]
name = "telegram-bot"
version = "1.0.0"
edition = "2021"

[dependencies]
# Telegram bot framework (teloxide 0.17, latest stable). We use long polling
# (via `repl`) which needs no public webhook endpoint, and rustls for a leaner
# TLS stack. `macros` gives us command/dispatch macros if needed.
teloxide = { version = "0.17", default-features = false, features = ["macros", "rustls", "ctrlc_handler"] }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "fs", "process", "net"] }
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-rustls", "macros", "chrono"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "cookies"] }
dotenv = "0.15"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
md5 = "0.7"
rand = "0.8"
urlencoding = "2.1"
id3 = "1.14"
base64 = "0.22"
minimp3 = "0.6"
mp3lame-encoder = "0.2"
thiserror = "1.0"
