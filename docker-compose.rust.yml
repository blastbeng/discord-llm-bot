services:
  discord-llm-bot-rust:
    pull_policy: build
    build:
      context: ./bot
      dockerfile: Dockerfile
      network: host
    container_name: discord-bot-rust
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Rome
    volumes:
      - ".env:/app/.env"
      - "./config:/app/config"
      - "/tmp/discord-llm-bot:/tmp/discord-llm-bot"
    restart: no
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f bot || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
